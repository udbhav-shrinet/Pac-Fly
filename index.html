<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a09">
  <title>Fly Piano</title>
  <meta name="description" content="A simulated fly brain composes at the keys — heading and arousal drive a scale-constrained melody, no scripted songs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <header class="top">
      <div class="title"><h1>FLY PIANO</h1><p>a simulated fly brain, composing at the keys</p></div>
      <div class="top-meta"><span id="clock">00:00</span><span id="backend-badge">CONNECTOME LIF</span></div>
    </header>

    <section class="keyboard-card" aria-label="Piano performed by the simulated fly">
      <div class="keyboard">
        <div class="performer" id="performer"><i></i></div>
        <div class="keys" id="keys"></div>
      </div>
    </section>

    <section class="transport">
      <button id="play-track" class="play" type="button" aria-label="Start the fly's performance">▶</button>
      <p id="status-text">press play — the fly's brain will compose</p>
    </section>

    <section class="panels">
      <div class="panel">
        <div class="panel-head"><h2>Activity</h2><b id="dopamine-value">—</b></div>
        <canvas id="wave" width="600" height="90"></canvas>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Neurons</h2><b id="neuron-value">— / —</b></div>
        <canvas id="neural" width="300" height="90"></canvas>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Hormones</h2></div>
        <div class="receptor-rows">
          <div class="receptor-row"><small>DOPAMINE</small><div class="dots" id="dots-da"></div></div>
          <div class="receptor-row"><small>SEROTONIN</small><div class="dots" id="dots-5ht"></div></div>
          <div class="receptor-row"><small>OCTOPAMINE</small><div class="dots" id="dots-oa"></div></div>
        </div>
      </div>
      <div class="panel panel-emotion">
        <div class="panel-head"><h2>Emotion</h2></div>
        <div class="emotion-ring" id="emotion-ring"><b id="emotion-value">—</b></div>
      </div>
    </section>
  </main>
  <script src="Connectome.js"></script><script src="FlyNeuralEngine.js"></script><script src="FullBrainBridge.js"></script><script src="main.js"></script>
</body>
</html>
